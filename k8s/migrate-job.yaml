apiVersion: batch/v1
kind: Job
metadata:
  name: bankruptcy-db-migrate
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: REPLACE_WITH_BACKEND_IMAGE
          command: ["python", "-m", "scripts.migrate"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: bankruptcy-backend-secrets
                  key: database-url
