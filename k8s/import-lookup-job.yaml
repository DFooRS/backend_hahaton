apiVersion: batch/v1
kind: Job
metadata:
  name: bankruptcy-lookup-import
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: import
          image: REPLACE_WITH_BACKEND_IMAGE
          command: ["python", "-m", "scripts.import_lookup"]
          envFrom:
            - configMapRef:
                name: bankruptcy-backend-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: bankruptcy-backend-secrets
                  key: database-url
            - name: DATA_ZIP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: bankruptcy-backend-secrets
                  key: data-zip-password
                  optional: true
          resources:
            requests:
              memory: 1Gi
              ephemeral-storage: 4Gi
            limits:
              memory: 3Gi
              ephemeral-storage: 7Gi
